<!-- Add to donor-matching.html before closing body -->
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Map Container -->
<div class="map-container">
    <div id="donorMap" style="height: 400px; width: 100%;"></div>
</div>

<!-- Map JavaScript -->
<script>
    // Initialize map
    let map;
    let markers = [];
    let userMarker;
    
    function initMap() {
        // Default center (Mumbai)
        const defaultCenter = [19.0760, 72.8777];
        
        // Create map
        map = L.map('donorMap').setView(defaultCenter, 13);
        
        // Add tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // Add user location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.setView([lat, lng], 15);
                    
                    // Add user marker
                    if (userMarker) {
                        map.removeLayer(userMarker);
                    }
                    userMarker = L.marker([lat, lng], {
                        icon: L.icon({
                            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
                            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                            iconSize: [25, 41],
                            iconAnchor: [12, 41],
                            popupAnchor: [1, -34],
                            shadowSize: [41, 41]
                        })
                    }).addTo(map)
                    .bindPopup('📍 Your Location');
                    
                    // Find nearby donors
                    findNearbyDonors(lat, lng);
                },
                error => {
                    console.warn('Location error:', error.message);
                    findNearbyDonors(defaultCenter[0], defaultCenter[1]);
                }
            );
        } else {
            findNearbyDonors(defaultCenter[0], defaultCenter[1]);
        }
    }
    
    // Find nearby donors
    function findNearbyDonors(lat, lng) {
        // Sample donor data (replace with API call)
        const sampleDonors = [
            { id: 1, name: 'Priya Patel', lat: lat + 0.01, lng: lng + 0.01, blood: 'A+', distance: 1.2 },
            { id: 2, name: 'Rahul Sharma', lat: lat - 0.008, lng: lng + 0.015, blood: 'O+', distance: 2.5 },
            { id: 3, name: 'Amit Kumar', lat: lat + 0.015, lng: lng - 0.005, blood: 'B+', distance: 3.8 },
            { id: 4, name: 'Sneha Reddy', lat: lat - 0.005, lng: lng - 0.01, blood: 'AB-', distance: 1.8 },
            { id: 5, name: 'Vikram Singh', lat: lat + 0.02, lng: lng + 0.02, blood: 'O-', distance: 4.2 }
        ];
        
        // Add donor markers
        sampleDonors.forEach(donor => {
            const markerColor = getBloodGroupColor(donor.blood);
            
            const marker = L.marker([donor.lat, donor.lng], {
                icon: L.icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41]
                })
            }).addTo(map);
            
            // Custom popup
            const popupContent = `
                <div style="padding: 8px;">
                    <strong>${donor.name}</strong><br>
                    Blood: ${donor.blood}<br>
                    Distance: ${donor.distance} km<br>
                    <button onclick="acceptDonor('${donor.name}')" 
                            style="background:#28A745;color:white;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;margin-top:4px;">
                        Accept
                    </button>
                </div>
            `;
            marker.bindPopup(popupContent);
            markers.push(marker);
        });
    }
    
    // Initialize map on page load
    document.addEventListener('DOMContentLoaded', function() {
        // Wait for map container to be rendered
        setTimeout(initMap, 500);
    });
    
    // Refresh map on window resize
    window.addEventListener('resize', function() {
        if (map) {
            setTimeout(() => map.invalidateSize(), 200);
        }
    });
</script>
